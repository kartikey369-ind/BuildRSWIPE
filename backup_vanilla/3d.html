<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildRSWIPE 3D | The Elite Dimension</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Barlow:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --green: #6abf45;
  --dark: #080c07;
  --white: #ffffff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Barlow', sans-serif; 
  background: var(--dark); 
  color: var(--white); 
  overflow: hidden;
}
#canvas-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}
.overlay {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2rem;
  pointer-events: none;
  text-align: center;
}
.nav {
  position: absolute;
  top: 4rem;
  left: 4rem;
  right: 4rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: auto;
}
.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 6px;
  font-weight: 900;
  text-decoration: none;
  color: var(--white);
}
.logo span { color: var(--green); }

.hero-content {
  pointer-events: auto;
  max-width: 1000px;
}
.hero-h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(5rem, 15vw, 12rem);
  line-height: 0.8;
  letter-spacing: -8px;
  text-transform: uppercase;
  margin-bottom: 2rem;
  font-weight: 900;
}
.hero-h1 span { color: var(--green); }
.hero-p {
  font-size: 1rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-bottom: 3rem;
  font-weight: 700;
}

.btn-wrap {
  display: flex;
  gap: 2rem;
  justify-content: center;
}
.btn {
  display: inline-block;
  padding: 1.25rem 3.5rem;
  background: var(--green);
  color: var(--dark);
  text-decoration: none;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 1rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  border-radius: 2px;
}
.btn:hover {
  background: var(--white);
  transform: translateY(-5px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.btn-outline {
  background: transparent;
  color: var(--white);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-outline:hover {
  border-color: var(--white);
  background: transparent;
}

.footer-info {
  position: absolute;
  bottom: 4rem;
  left: 4rem;
  right: 4rem;
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.2);
}

.ui-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  letter-spacing: 2px;
  color: var(--green);
  opacity: 0.4;
}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="overlay">
  <nav class="nav">
    <a href="index.html" class="logo">BUILDR<span>SWIPE</span></a>
    <div style="display:flex; gap: 2rem">
      <a href="index.html" style="color: var(--white); text-decoration: none; font-size: 0.7rem; font-weight: 700; letter-spacing: 2px;">STANDARD INTERFACE</a>
    </div>
  </nav>

  <div class="hero-content">
    <p class="hero-p">The Dimension of Discipline</p>
    <h1 class="hero-h1">CORE<br><span>STRENGTH</span></h1>
    <div class="btn-wrap">
      <a href="#" class="btn">Enter Network</a>
      <a href="index.html" class="btn btn-outline">Go Back</a>
    </div>
  </div>

  <div class="footer-info">
    <div>AUTHENTICATED ACCESS ONLY</div>
    <div>BY KARTIKAY</div>
  </div>
</div>

<div class="ui-hint">INTERACT WITH THE CORE</div>

<script>
let scene, camera, renderer, mesh, lines, particles;

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 12;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // Strength Core (Octahedron - Sharp, stable, aggressive)
  const coreGeo = new THREE.OctahedronGeometry(3, 0);
  const coreMat = new THREE.MeshPhongMaterial({
    color: 0x6abf45,
    wireframe: true,
    transparent: true,
    opacity: 0.4
  });
  mesh = new THREE.Mesh(coreGeo, coreMat);
  scene.add(mesh);

  // Inner pulsing core
  const innerGeo = new THREE.OctahedronGeometry(1, 0);
  const innerMat = new THREE.MeshPhongMaterial({
    color: 0x6abf45,
    emissive: 0x6abf45,
    emissiveIntensity: 0.8
  });
  const innerMesh = new THREE.Mesh(innerGeo, innerMat);
  mesh.add(innerMesh);

  // Network Lines
  const lineMat = new THREE.LineBasicMaterial({ color: 0x6abf45, transparent: true, opacity: 0.1 });
  const lineGeo = new THREE.BufferGeometry();
  const linePoints = [];
  for(let i=0; i<100; i++) {
    linePoints.push(new THREE.Vector3((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20));
  }
  lineGeo.setFromPoints(linePoints);
  lines = new THREE.Line(lineGeo, lineMat);
  scene.add(lines);

  // Lights
  const pLight = new THREE.PointLight(0x6abf45, 2, 50);
  pLight.position.set(5, 5, 5);
  scene.add(pLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.1));

  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('resize', onWindowResize);

  animate();
}

let mouseX = 0, mouseY = 0;
function onMouseMove(e) {
  mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
  mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);

  const time = Date.now() * 0.001;
  
  mesh.rotation.y += 0.005;
  mesh.rotation.x += 0.002;
  
  // Pulse effect
  const scale = 1 + Math.sin(time * 2) * 0.1;
  mesh.scale.set(scale, scale, scale);
  
  lines.rotation.y -= 0.001;

  // Smooth camera
  camera.position.x += (mouseX * 20 - camera.position.x) * 0.05;
  camera.position.y += (-mouseY * 20 - camera.position.y) * 0.05;
  camera.lookAt(scene.position);

  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
